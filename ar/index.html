<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>AR Standalone - Image Targets</title>
  <link rel="stylesheet" type="text/css" href="index.css">

  <!-- Expose THREE and GLTFLoader globally for 8th Wall -->
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    window.THREE = THREE;
    window.GLTFLoader = GLTFLoader;
  </script>

  <!-- XR Extras - from CDN (handles compression properly) -->
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- 8th Wall Engine (local copy, regular script with async) -->
  <script src="./xr/xr.js" async data-preload-chunks="slam"></script>

  <!-- Client code (ES module) -->
  <script type="module" src="./index.js"></script>
</head>
<body>
  <canvas id="camerafeed"></canvas>
</body>
</html>
