services:
  db:
    image: postgres:16-alpine
    container_name: smart-luben-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_luben
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_luben"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
