server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Sin barra final -> redirigir (si no cae en location / y da 404).
  # $http_host conserva el puerto (:8080 en dev).
  location = /ar {
    return 301 $scheme://$http_host/ar/;
  }

  # App AR standalone bajo /ar/
  location /ar/ {
    alias /usr/share/nginx/html/ar/;
    try_files $uri $uri/ /ar/index.html;
  }

  # API del backend (solo útil cuando comparte compose network con 'backend',
  # ej: compose dev. En prod /api lo atiende el nginx del frontend).
  location /api/ {
    proxy_pass http://backend:8000/api/;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Todo lo demás al index del AR (solo sirve /ar/)
  location / {
    return 404;
  }
}
