name: AR CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "ar/**"
      - "docker-compose.yml"
      - ".github/workflows/ar.yml"
      # Cambios de contrato que rompen al AR
      - "backend/app/routers/productos.py"
      - "backend/app/routers/espacios.py"
      - "backend/app/routers/sync.py"
      - "backend/app/routers/uploads.py"
      - "backend/app/schemas/producto.py"
      - "backend/app/schemas/espacio.py"

  push:
    branches:
      - main
    paths:
      - "ar/**"
      - "docker-compose.yml"
      - ".github/workflows/ar.yml"
      - "backend/app/routers/productos.py"
      - "backend/app/routers/espacios.py"
      - "backend/app/routers/sync.py"
      - "backend/app/routers/uploads.py"
      - "backend/app/schemas/producto.py"
      - "backend/app/schemas/espacio.py"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/smart-luben-ar

jobs:

  test:
    name: Test AR
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ar/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Validate nginx config
        run: docker run --rm --add-host backend:127.0.0.1 -v "$PWD/ar-nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./ar
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  deploy:
    name: Deploy AR
    runs-on: self-hosted

    needs: build

    concurrency:
      group: prod-deploy
      cancel-in-progress: false

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore .env
        run: |
          if [ -f ../.env ]; then
            cp ../.env .env
          elif [ ! -f .env ]; then
            echo "::error::Falta .env: ni ../.env ni ./.env existen. Créalo a partir de .env.example."
            exit 1
          fi

      - name: Restore garage.toml
        run: |
          if [ -f ../garage.toml ]; then
            cp ../garage.toml docker/garage.toml
          fi
          if [ ! -f docker/garage.toml ]; then
            echo "::error::Falta docker/garage.toml: ni ../garage.toml ni ./docker/garage.toml existen."
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: docker compose pull ar

      - name: Start ar
        run: docker compose up -d ar

      - name: Check ar status
        run: docker compose ps ar
