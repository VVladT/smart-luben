services:

  db:
    image: postgres:16-alpine
    container_name: smart-luben-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    image: ghcr.io/vvladt/smart-luben-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: smart-luben-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEBUG: ${DEBUG}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}

    volumes:
      - backend_models:/app/models

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s


  frontend:
    image: ghcr.io/vvladt/smart-luben-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: smart-luben-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy
      ar:
        condition: service_started


  ar:
    image: ghcr.io/vvladt/smart-luben-ar:latest
    build:
      context: ./ar
      dockerfile: Dockerfile

    container_name: smart-luben-ar
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ar/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5


  garage:
    image: dxflrs/garage:v2.4.1
    container_name: smart-luben-garage
    restart: unless-stopped

    # Single-node + bucket/key desde env (sin layout manual).
    # Requiere ./docker/garage.toml (ver docker/garage.toml.example).
    # S3_ACCESS_KEY debe empezar con GK (ej: GK + openssl rand -hex 16).
    command: /garage server --single-node --default-bucket

    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: smart-luben

    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./docker/garage.toml:/etc/garage.toml:ro

    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  backend_models:
  garage_meta:
  garage_data:
