services:

  db:
    image: postgres:16-alpine
    container_name: smart-luben-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    container_name: smart-luben-backend

    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEBUG: ${DEBUG}

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: smart-luben-frontend

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  postgres_data:
