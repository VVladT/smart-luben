# Gateway dev: punto único como en prod (puertos sueltos quedan disponibles igual).
# Uso: http://localhost/ o http://<ip-lan>/ desde PC y móvil.

upstream frontend_dev {
  server frontend:4200;
}

upstream backend_dev {
  server backend:8000;
}

upstream ar_dev {
  server ar:80;
}

upstream s3_dev {
  server garage:3900;
}

server {
  listen 80;
  server_name _;

  # ng serve (HMR por websocket)
  location / {
    proxy_pass http://frontend_dev;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://backend_dev/api/;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ar/ {
    proxy_pass http://ar_dev;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /ar {
    return 301 $scheme://$http_host/ar/;
  }

  # S3 directo para presigned PUT del navegador (misma lógica que prod).
  location ~ ^/smart-luben/ {
    client_max_body_size 60m;

    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, DELETE, HEAD, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Amz-Date, X-Amz-Content-Sha256, X-Amz-Security-Token, ngrok-skip-browser-warning';
      add_header 'Access-Control-Max-Age' 86400;
      add_header 'Content-Length' 0;
      add_header 'Content-Type' 'text/plain';
      return 204;
    }

    proxy_pass http://s3_dev;

    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Expose-Headers' 'ETag, X-Amz-Request-Id' always;
  }
}
