name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/smart-luben-backend

concurrency:
  group: prod-deploy
  cancel-in-progress: false


jobs:

  test:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_luben_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d smart_luben_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/smart_luben_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest


  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  deploy:
    name: Deploy Backend
    runs-on: self-hosted

    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore .env
        run: |
          if [ -f ../.env ]; then
            cp ../.env .env
          elif [ ! -f .env ]; then
            echo "::error::Falta .env: ni ../.env ni ./.env existen. Créalo a partir de .env.example."
            exit 1
          fi

      - name: Restore garage.toml
        run: |
          if [ -f ../garage.toml ]; then
            cp ../garage.toml docker/garage.toml
          fi
          if [ ! -f docker/garage.toml ]; then
            echo "::error::Falta docker/garage.toml: ni ../garage.toml ni ./docker/garage.toml existen. Créalo desde docker/garage.toml.example (vive junto al .env, fuera de git)."
            exit 1
          fi

      - name: Validate required files and secrets
        run: |
          if [ ! -f docker/garage.toml ]; then
            echo "::error::Falta docker/garage.toml (ver docker/garage.toml.example). Sin él Garage no arranca."
            exit 1
          fi
          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a
          faltan=0
          for var in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB DATABASE_URL S3_ACCESS_KEY S3_SECRET_KEY S3_ENDPOINT S3_PUBLIC_ENDPOINT; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Falta $var en .env"
              faltan=1
            fi
          done
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::warning::Sin DEEPSEEK_API_KEY el chatbot responde degradado."
          fi
          # shellcheck disable=SC2086
          [ $faltan -eq 0 ] || exit 1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest images
        run: docker compose pull db backend garage

      - name: Start data services
        run: docker compose up -d --wait db garage

      - name: Run database migrations
        run: docker compose run --rm backend alembic upgrade head

      - name: Run database seed (idempotente, 4 espacios)
        run: docker compose run --rm backend python scripts/seed.py

      - name: Check product models (warn-only)
        run: |
          docker compose run --rm backend python -c "
          import asyncio
          from sqlalchemy import select, func
          from sqlalchemy.ext.asyncio import create_async_engine, AsyncSession
          from sqlalchemy.orm import sessionmaker
          from app.config import settings
          from app.models import Producto

          async def main():
              engine = create_async_engine(settings.database_url, echo=False)
              S = sessionmaker(engine, class_=AsyncSession, expire_on_commit=False)
              async with S() as db:
                  n = (await db.execute(select(func.count(Producto.id)).where(Producto.activo == True))).scalar()
                  sin = (await db.execute(select(func.count(Producto.id)).where(Producto.activo == True, Producto.modelo_url.is_(None)))).scalar()
                  print(f'::notice::Productos activos: {n}, sin modelo 3D: {sin} (upload_default_models.py si falta alguno)')
              await engine.dispose()

          asyncio.run(main())
          "

      - name: Generate synthetic movements
        env:
          FORCE: "true"
        run: docker compose run --rm -e FORCE=true backend python scripts/generate_synthetic_movements.py --force

      - name: Materialize ML features
        run: docker compose run --rm backend python scripts/materialize_ml_features.py

      - name: Train demand model
        run: docker compose run --rm backend python ml/train_demand.py

      - name: Train ranker model
        run: docker compose run --rm backend python ml/train_ranker.py

      - name: Start backend
        run: docker compose up -d db backend

      - name: Check backend status
        run: docker compose ps db backend
